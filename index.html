<!DOCTYPE html>
<html lang="it" data-root=".">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NeuroTools</title>
<meta name="description" content="Calcolatori e generatori di referto per la neuroradiologia: centili pediatrici, criteri diagnostici e misure quantitative. Funziona anche senza rete.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Neuro-tools">
<meta property="og:locale" content="it_IT">
<meta property="og:title" content="Neuro-tools — strumenti clinici per la neuroradiologia">
<meta property="og:description" content="Calcolatori e generatori di referto per la neuroradiologia: centili pediatrici, criteri diagnostici e misure quantitative. Funziona anche senza rete.">
<meta property="og:url" content="https://gmadevs.github.io/neurotools/">
<meta property="og:image" content="https://gmadevs.github.io/neurotools/assets/img/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo Neuro-tools: uno scudo con un encefalo e strumenti di misura">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#14181f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141a">
<link rel="stylesheet" href="assets/nav.css">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* Palette, reset, font e tipografia arrivano da assets/base.css.
     Qui resta solo ciò che è specifico della home. */

  /* ── HERO ──────────────────────────────────────────────────────────────
     Installata come app non c'è la barra del titolo del browser: senza
     questa riga l'applicazione si apre su un campo di ricerca e non dice
     nemmeno come si chiama. */
  .hero {
    background: var(--accent);
    color: #fff;
    padding: var(--sp-5) var(--sp-6) var(--sp-6);
    text-align: center;
  }

  .hero-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-3);
    margin-bottom: var(--sp-5);
  }

  .hero-logo {
    width: auto;
    height: 44px;
    flex-shrink: 0;
  }

  .hero-name {
    font-family: var(--mono);
    font-size: var(--fs-lg);
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .hero-tagline {
    display: block;
    font-family: var(--sans);
    font-size: var(--fs-sm);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    opacity: .85;
    margin-top: 2px;
  }

  .search-wrap {
    max-width: 500px;
    margin: 0 auto;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: .6rem 1rem .6rem 2.4rem;
    border: none;
    border-radius: 4px;
    font-family: var(--sans);
    font-size: var(--fs-md);
    background: rgba(255,255,255,.15);
    color: #fff;
    outline: none;
    transition: background .15s;
  }

  .search-wrap input::placeholder { color: rgba(255,255,255,.75); }
  .search-wrap input:focus { background: rgba(255,255,255,.25); }

  .search-wrap svg {
    position: absolute;
    left: .7rem;
    top: 50%;
    transform: translateY(-50%);
    opacity: .75;
    pointer-events: none;
  }

  /* ── LAYOUT ── */
  .main-layout {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    padding: 2rem 1.5rem 4rem;
    gap: 2rem;
  }

  /* ── NAVIGAZIONE PER CATEGORIA ──────────────────────────────────────────
     Stesso markup a ogni larghezza: colonna laterale su desktop, riga di
     chip scorrevole su telefono. Prima spariva del tutto sotto i 640px, e
     con essa l'unico modo di filtrare per gruppo. */
  .catnav {
    width: 220px;
    flex-shrink: 0;
    position: sticky;
    top: 1rem;
  }

  .catnav-title {
    font-family: var(--mono);
    font-size: var(--fs-xs);
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .8rem;
  }

  .catnav-list { list-style: none; }
  .catnav-list li + li { margin-top: 2px; }

  .cat-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 4px;
    padding: var(--sp-2) var(--sp-3);
    font-family: var(--sans);
    font-size: var(--fs-sm);
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, color .12s;
  }

  .cat-btn:hover { background: var(--accent-light); color: var(--accent-ink); }

  .cat-btn[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .cat-count {
    float: right;
    font-family: var(--mono);
    font-size: var(--fs-xs);
    opacity: .7;
    margin-top: 1px;
  }

  /* ── ELENCO STRUMENTI ── */
  .tools-col { flex: 1; min-width: 0; }

  .category-section { margin-bottom: 2rem; }

  .category-heading {
    font-family: var(--mono);
    font-size: var(--fs-sm);
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent-ink);
    padding-bottom: .45rem;
    border-bottom: 1.5px solid var(--accent-light);
    margin-bottom: .8rem;
  }

  .subcategory-heading {
    font-family: var(--mono);
    font-size: var(--fs-xs);
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 1.1rem 0 .5rem;
  }

  .tool-list { list-style: none; }

  /* Titolo e descrizione su due righe. Prima stavano su una riga sola con
     white-space:nowrap: la descrizione veniva troncata già su desktop e
     nascosta del tutto sotto i 640px. */
  .tool-item {
    display: block;
    padding: .6rem .7rem;
    border-radius: 4px;
    text-decoration: none;
    color: var(--ink);
    transition: background .12s;
  }

  .tool-item:hover { background: var(--accent-light); }
  .tool-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tool-item-title {
    display: block;
    font-size: var(--fs-md);
    font-weight: 600;
    color: var(--accent-ink);
    margin-bottom: .1rem;
  }

  .tool-item-desc {
    display: block;
    font-size: var(--fs-sm);
    color: var(--muted);
    line-height: 1.45;
  }

  .badge-new {
    display: inline-block;
    font-family: var(--mono);
    font-size: var(--fs-xs);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: #17663e;
    color: #fff;
    border-radius: 3px;
    padding: 1px 5px;
    vertical-align: middle;
    margin-left: .35rem;
    position: relative;
    top: -1px;
  }

  .no-results {
    font-size: var(--fs-md);
    color: var(--muted);
    font-style: italic;
    padding: 1rem .7rem;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 760px) {
    .main-layout {
      display: block;
      padding: 0 0 3rem;
    }

    .catnav {
      width: auto;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid var(--rule);
      padding: .6rem 0;
    }

    .catnav-title { display: none; }

    .catnav-list {
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 1rem;
    }

    .catnav-list::-webkit-scrollbar { display: none; }
    .catnav-list li + li { margin-top: 0; }

    .cat-btn {
      width: auto;
      white-space: nowrap;
      border: 1px solid var(--rule);
      border-radius: 99px;
      padding: var(--sp-2) var(--sp-4);
      min-height: var(--touch);
      background: var(--card);
      font-size: var(--fs-sm);
    }

    .cat-count {
      float: none;
      margin-left: .4rem;
    }

    .tools-col { padding: 1.4rem 1rem 0; }

    .tool-item { padding: .7rem .6rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-brand">
    <img class="hero-logo" src="assets/img/logo-mark.png" alt="" width="39" height="44">
    <h1 class="hero-name">
      Neuro-tools
      <span class="hero-tagline">Strumenti clinici per la neuroradiologia</span>
    </h1>
  </div>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.5"/>
      <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <label class="visually-hidden" for="search-input">Cerca uno strumento</label>
    <!-- data-no-memory: tornando alla home ci si aspetta l'elenco completo,
         non l'ultima ricerca rimasta nel campo -->
    <input type="text" id="search-input" placeholder="Cerca uno strumento…" autocomplete="off" data-no-memory>
  </div>
</div>

<div class="main-layout">
  <nav class="catnav" aria-label="Categorie">
    <div class="catnav-title">Categorie</div>
    <ul class="catnav-list" id="catnav-list"></ul>
  </nav>

  <div class="tools-col" id="tools-col" aria-live="polite"></div>
</div>

<script src="assets/site-config.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var tools = window.SITE_TOOLS || [];
  var NEW_IDS = ['verme-tronco-bambini', 'fossa-posteriore-adulto'];
  var FALLBACK_CAT = 'Altri strumenti';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  var catOf = function (t) { return t.category || FALLBACK_CAT; };

  /* ── struttura per categoria e sottocategoria ── */
  var categories = [];
  var subcatsOf = {};

  tools.forEach(function (t) {
    var cat = catOf(t);
    if (subcatsOf[cat] === undefined) { subcatsOf[cat] = []; categories.push(cat); }
    if (t.subcategory && subcatsOf[cat].indexOf(t.subcategory) === -1) {
      subcatsOf[cat].push(t.subcategory);
    }
  });

  var byIt = function (a, b) { return a.localeCompare(b, 'it'); };
  categories.sort(byIt);
  categories.forEach(function (c) { subcatsOf[c].sort(byIt); });

  var activeCategory = 'all';

  var catnavList = document.getElementById('catnav-list');
  var toolsCol = document.getElementById('tools-col');
  var searchInput = document.getElementById('search-input');

  /* ── navigazione per categoria ──
     I conteggi si calcolano sulla sola ricerca, non sulla categoria attiva:
     altrimenti selezionando un gruppo tutti gli altri mostrerebbero 0 e non
     si saprebbe più quanti strumenti contengono. */
  function buildCatnav(searchFiltered) {
    var counts = { all: searchFiltered.length };
    categories.forEach(function (cat) {
      counts[cat] = searchFiltered.filter(function (t) { return catOf(t) === cat; }).length;
    });

    var items = [{ key: 'all', label: 'Tutti gli strumenti' }].concat(
      categories.map(function (c) { return { key: c, label: c }; })
    );

    catnavList.innerHTML = items.map(function (item) {
      var on = activeCategory === item.key;
      return '<li><button type="button" class="cat-btn" aria-pressed="' + on + '"' +
             ' data-cat="' + esc(item.key) + '">' + esc(item.label) +
             '<span class="cat-count">' + (counts[item.key] || 0) + '</span></button></li>';
    }).join('');

    catnavList.querySelectorAll('.cat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeCategory = btn.dataset.cat;
        render();
      });
    });
  }

  /* ── elenco strumenti ── */
  function itemHtml(t) {
    var isNew = NEW_IDS.indexOf(t.id) !== -1;
    return '<li><a class="tool-item" href="' + esc(t.url) + '">' +
             '<span class="tool-item-title">' + esc(t.title) +
               (isNew ? '<span class="badge-new">Nuovo</span>' : '') +
             '</span>' +
             '<span class="tool-item-desc">' + esc(t.description) + '</span>' +
           '</a></li>';
  }

  function buildList(filtered) {
    if (!filtered.length) {
      toolsCol.innerHTML = '<p class="no-results">Nessuno strumento trovato.</p>';
      return;
    }

    var visibleCats = activeCategory === 'all'
      ? categories
      : categories.filter(function (c) { return c === activeCategory; });

    toolsCol.innerHTML = visibleCats.map(function (cat) {
      var catItems = filtered.filter(function (t) { return catOf(t) === cat; });
      if (!catItems.length) return '';

      var html = '<div class="category-section"><div class="category-heading">' +
                 esc(cat) + '</div>';

      var direct = catItems.filter(function (t) { return !t.subcategory; });
      if (direct.length) {
        html += '<ul class="tool-list">' + direct.map(itemHtml).join('') + '</ul>';
      }

      subcatsOf[cat].forEach(function (sub) {
        var subItems = catItems.filter(function (t) { return t.subcategory === sub; });
        if (!subItems.length) return;
        html += '<div class="subcategory-heading">' + esc(sub) + '</div>' +
                '<ul class="tool-list">' + subItems.map(itemHtml).join('') + '</ul>';
      });

      return html + '</div>';
    }).join('');
  }

  /* ── render ── */
  function render() {
    var query = searchInput.value.trim().toLowerCase();

    var searchFiltered = tools.filter(function (t) {
      if (!query) return true;
      /* la ricerca guarda anche la sottocategoria: "ecografia" e
         "risonanza" sono fra i termini più naturali da digitare */
      var haystack = [t.title, t.description, t.category, t.subcategory]
        .join(' ').toLowerCase();
      return haystack.indexOf(query) !== -1;
    });

    buildCatnav(searchFiltered);
    buildList(searchFiltered.filter(function (t) {
      return activeCategory === 'all' || catOf(t) === activeCategory;
    }));
  }

  searchInput.addEventListener('input', function () {
    activeCategory = 'all';
    render();
  });

  render();
})();
</script>

</body>
</html>
